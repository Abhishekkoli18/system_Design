
name: Ecommerce CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

env:
  BACKEND_IMAGE: docker.io/abhishekkoli18/ecommerce-backend
  FRONTEND_IMAGE: docker.io/abhishekkoli18/ecommerce-frontend

jobs:

  # ==========================================
  # JOB 1: BUILD AND TEST
  # ==========================================

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend Setup
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Backend Dependencies
        working-directory: ecommerce-app/backend/EcommerceApi
        run: dotnet restore

      - name: Build Backend
        working-directory: ecommerce-app/backend/EcommerceApi
        run: dotnet build --no-restore --configuration Release

      - name: Test Backend
        working-directory: ecommerce-app/backend/EcommerceApi
        run: dotnet test --configuration Release --verbosity normal

      # Frontend Setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecommerce-app/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ecommerce-app/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ecommerce-app/frontend
        run: npm run build


  # ==========================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # ==========================================

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs: build-and-test

    # Only push images when code is pushed to master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Docker Hub Authentication
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Setup Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ======================================
      # BACKEND IMAGE
      # ======================================

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-app/backend/EcommerceApi
          file: ./ecommerce-app/backend/EcommerceApi/Dockerfile
          push: true
          tags: |
            docker.io/abhishekkoli18/ecommerce-backend:${{ github.sha }}
            docker.io/abhishekkoli18/ecommerce-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ======================================
      # FRONTEND IMAGE
      # ======================================

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-app/frontend
          file: ./ecommerce-app/frontend/Dockerfile
          push: true
          tags: |
            docker.io/abhishekkoli18/ecommerce-frontend:${{ github.sha }}
            docker.io/abhishekkoli18/ecommerce-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
