apiVersion: v1
kind: Secret

metadata:
  name: {{ .Release.Name }}-backend-secret

type: Opaque

stringData:
  connection-string: {{ .Values.backend.secret.connectionString | quote }}

  jwt-key: {{ .Values.backend.secret.jwtKey | quote }}

  jwt-issuer: {{ .Values.backend.secret.jwtIssuer | quote }}

  jwt-audience: {{ .Values.backend.secret.jwtAudience | quote }}